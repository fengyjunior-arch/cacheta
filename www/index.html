<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>PiFengy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<style>
/* Layout: tela cheia — barra superior, adversários, mesa (monte · lixo · coringas + trilha de descartes) que cresce, e a mão grande ancorada embaixo. Preto e laranja, tema escuro fixo. */
:root{
  --bg:#0a0a0b; --s1:#141416; --s2:#1e1e21; --s3:#2a2a2f;
  --line:rgba(255,255,255,.09);
  --o:#ff7a1a; --o2:#ffa149; --o-ink:#1a0c00;
  --text:#f4f4f5; --muted:#a3a3ad;
  --face:#fbfaf6; --face-edge:#e2ded3; --ink:#121212; --red:#d7262b;
  --gold-a:#fff4c7; --gold-b:#f5c84c; --gold-c:#c58e17; --gold-ink:#3a2804;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 40% at 50% -8%,rgba(255,122,26,.17),transparent 70%),var(--bg);background-color:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-inline:10px;padding-block:8px 10px;display:flex;flex-direction:column;gap:10px;min-height:100%}
.brand{font-family:var(--display);font-stretch:125%;font-weight:900;text-transform:none;color:var(--o);line-height:1;letter-spacing:.01em}
h1{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(2.6rem,13vw,4.2rem);text-transform:uppercase;margin:0;line-height:.9;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--o)}
h2{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;color:var(--o);font-weight:700}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--text);padding:10px 14px;font-weight:600;min-height:44px}
button:active{background:var(--s3)}
button:focus-visible,input:focus-visible{outline:2px solid var(--o);outline-offset:2px}
button.primary{background:var(--o);color:var(--o-ink);border-color:var(--o);font-weight:800}
button.primary:active{background:var(--o2)}
button.danger{border-color:rgba(239,68,68,.55);color:#fca5a5;background:transparent}
button:disabled{opacity:.35;cursor:not-allowed}
input{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-height:46px;min-width:0}
input.code{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.panel{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--s1);display:flex;flex-direction:column;gap:12px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codebig{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(2.4rem,12vw,3.4rem);letter-spacing:.14em;color:var(--o);text-align:center;line-height:1}
.net{font-size:.8rem;text-align:center;color:var(--o);font-weight:600}

/* topo */
.top{display:flex;align-items:center;gap:8px}
.top .brand{font-size:1.3rem}
.top .info{flex:1;min-width:0;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.top button{min-height:36px;padding:6px 12px;font-size:.84rem}

/* relógio */
.clock{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem;white-space:nowrap}
.clock::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--o)}
.clock.off{color:var(--muted);font-weight:600}
.clock.off::before{background:#6b6b75}
.clock small{font-weight:600;color:var(--muted);font-size:.7rem}
button.clock{min-height:32px;cursor:pointer;color:var(--text)}
.clock.paused{color:var(--muted);border-color:rgba(255,122,26,.45)}
.clock.paused::before{background:none;width:auto;height:auto;content:"❚❚";color:var(--o);font-size:.6rem;border-radius:0}
.alarm{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(92%,520px);z-index:10;background:var(--o);color:var(--o-ink);border-radius:16px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.6);display:flex;align-items:center;gap:12px;animation:pop .25s ease-out}
.alarm b{display:block;font-family:var(--display);font-stretch:115%;font-weight:900;font-size:1.25rem;text-transform:uppercase}
.alarm span{font-size:.88rem;font-weight:600}
.alarm button{background:var(--o-ink);color:var(--o);border:0;min-height:40px;margin-left:auto}
@keyframes pop{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.alarm{animation:none}}

/* adversários */
.opps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.opps::-webkit-scrollbar{display:none}
.opp{flex:1 1 0;min-width:76px;overflow:hidden;border:1px solid var(--line);border-radius:12px;padding:7px 9px;background:var(--s1);display:flex;flex-direction:column;gap:3px;position:relative}
.opp .nm{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.opp .meta{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta b{color:var(--o);font-weight:800}
.opp.turn{border-color:var(--o);background:linear-gradient(180deg,rgba(255,122,26,.2),rgba(255,122,26,.04));box-shadow:0 0 0 1px var(--o) inset}
.opp.off{opacity:.45}
.opp .dl{position:absolute;top:6px;right:6px;font:800 .58rem var(--ui);color:var(--o-ink);background:var(--o);border-radius:4px;padding:1px 4px}
.backs{display:flex;height:12px}
.backs i{width:8px;height:12px;border-radius:2px;background:#151515;border:1px solid var(--o);margin-right:-3px}

/* mesa */
.table{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:12px;background:radial-gradient(90% 90% at 50% 35%,#1d1d21,#111113);border:1px solid var(--line);border-radius:20px;padding:14px 10px 10px;--tc:clamp(66px,19vw,108px)}
.piles{display:grid;grid-template-columns:1fr 1fr 1.15fr;align-items:end;justify-items:center;gap:6px}
.pile{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;min-height:0;border-radius:12px;color:inherit}
.pile:active{background:none}
.pile:disabled{opacity:1;cursor:default}
.lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.pile .card,.pile .back,.pile .slot{width:var(--tc)}
.pile .card .r{font-size:calc(var(--tc)*.3)}
.pile .card .s1{font-size:calc(var(--tc)*.19)}
.pile .card .s{font-size:calc(var(--tc)*.46)}
.pile.can .card,.pile.can .back,.pile.can .slot{box-shadow:0 0 0 3px var(--o),0 0 26px rgba(255,122,26,.5)}
.back{aspect-ratio:5/7;border-radius:10px;border:2px solid var(--o);background:repeating-linear-gradient(135deg,#0f0f0f 0 6px,#1c1c1c 6px 12px);position:relative;box-shadow:0 8px 18px rgba(0,0,0,.6)}
.back::after{content:"";position:absolute;inset:30% 28%;border:2px solid var(--o);transform:rotate(45deg);border-radius:4px}
.slot{aspect-ratio:5/7;border-radius:10px;border:2px dashed rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;text-align:center;padding:4px}
.jk{display:flex;flex-direction:column;align-items:center;gap:7px}
.jk .pair{display:flex;gap:6px}
.jk .card{width:calc(var(--tc)*.62)}
.jk .card .r{font-size:calc(var(--tc)*.21)}
.jk .card .s1{display:none}
.jk .card .s{font-size:calc(var(--tc)*.3)}
.jk .vira{font-size:.74rem;color:var(--muted)}
.jk .vira b{color:var(--text)}
.trailbox{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.trailhead{display:flex;justify-content:space-between;align-items:center}
.trailhead button{min-height:30px;padding:3px 10px;font-size:.75rem;border-radius:99px;color:var(--o);border-color:rgba(255,122,26,.4);background:transparent}
.trail{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;min-height:56px;align-items:flex-start}
.trail::-webkit-scrollbar{display:none}
.trail .t{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto}
.trail .w{font-size:.6rem;color:var(--muted);font-weight:600;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trail .pk .card{outline:2px solid var(--o);outline-offset:1px}
.trail .pk .w{color:var(--o)}
.trail .empty{font-size:.78rem;color:var(--muted);align-self:center}

/* status */
.status{text-align:center;font-weight:700;font-size:1.02rem;min-height:1.4em}
.status.mine{color:var(--o)}
.log{text-align:center;font-size:.78rem;color:var(--muted);min-height:1.1em;margin-top:-6px}

/* cartas */
.card{position:relative;display:block;width:64px;aspect-ratio:5/7;height:auto;border-radius:10px;background:var(--face);color:var(--ink);border:1px solid var(--face-edge);box-shadow:0 6px 14px rgba(0,0,0,.55);font-family:var(--display);padding:0;min-height:0;flex:0 0 auto}
button.card:active{background:var(--face)}
.card.red{color:var(--red)}
.card .r{position:absolute;top:5%;left:9%;font-weight:900;font-size:1.3rem;line-height:1}
.card .s1{position:absolute;top:29%;left:10%;font-size:.9rem;line-height:1;font-family:var(--ui)}
.card .s{position:absolute;right:8%;bottom:5%;font-size:2rem;line-height:1;font-family:var(--ui)}
.card.joker,button.card.joker:active{background:linear-gradient(150deg,var(--gold-a) 0%,var(--gold-b) 48%,var(--gold-c) 100%);border-color:#9c6d0c;color:var(--gold-ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 6px 18px rgba(197,142,23,.4)}
.card.joker.red{color:#a8121a}
.card.joker::after{content:"★";position:absolute;top:4%;right:8%;font-family:var(--ui);font-size:.75rem;line-height:1;color:#6e4a00}
.card.sm{width:38px;border-radius:6px}
.card.sm .r{font-size:.95rem}
.card.sm .s1,.card.xs .s1{display:none}
.card.sm .s{font-size:1.25rem}
.card.md{width:48px;border-radius:7px}
.card.md .r{font-size:1.15rem}
.card.md .s1{display:none}
.card.md .s{font-size:1.6rem}
.card.xs{width:32px;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.card.xs .r{font-size:.8rem;top:4%;left:8%}
.card.xs .s{font-size:1.05rem;right:6%;bottom:3%}
.card.sm.joker::after,.card.xs.joker::after,.card.md.joker::after{font-size:.5rem}

/* mão */
.handwrap{display:flex;flex-direction:column;gap:10px}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 7px;padding-top:12px}
.hand .card{width:100%;transition:transform .12s,box-shadow .12s}
.hand .card .r{font-size:clamp(1.25rem,6.6vw,2.5rem)}
.hand .card .s1{font-size:clamp(.85rem,4.3vw,1.55rem)}
.hand .card .s{font-size:clamp(2rem,10.5vw,3.8rem)}
.hand .card.joker::after{font-size:clamp(.7rem,3.4vw,1.2rem)}
.hand .card.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--o),0 14px 24px rgba(0,0,0,.6)}
.nb{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--o);color:var(--o-ink);font:800 .56rem var(--ui);padding:2px 6px;border-radius:99px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.gb{position:absolute;bottom:-7px;left:3px;right:3px;height:4px;border-radius:2px;background:var(--o)}
.gb.jl{left:-5px;border-top-left-radius:0;border-bottom-left-radius:0}
.gb.jr{right:-5px;border-top-right-radius:0;border-bottom-right-radius:0}
.gb.par{background:none;height:0;border-top:2px dashed #8b8b95;border-radius:0}
.gsum{text-align:center;font-size:.78rem;color:var(--muted);min-height:1.1em}
.gsum b{color:var(--o)}
.seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:38px;padding:4px 6px;font-size:.84rem;border:0;background:transparent;border-radius:9px}
.seg button.on{background:var(--o);color:var(--o-ink);font-weight:800}
.seg .sep{width:1px;background:var(--line);margin:4px 2px}
.seg button.ar{flex:0 0 42px}
.fora{min-height:58px;font-size:1.08rem;animation:glow 1s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.fora{animation:none}}
.swap{min-height:46px;border-color:var(--o);color:var(--o);background:rgba(255,122,26,.08);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{min-height:56px;font-size:1.05rem}
#btnBater.ready{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,122,26,0)}to{box-shadow:0 0 0 6px rgba(255,122,26,.4)}}
@media (prefers-reduced-motion:reduce){#btnBater.ready{animation:none}.hand .card{transition:none}}

/* lobby e listas */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:var(--s2)}
.plist li .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li .w{font-variant-numeric:tabular-nums;color:var(--o);font-weight:800}
.plist li button{min-height:32px;padding:4px 10px;font-size:.78rem}
.bt{display:inline-block;font:800 .55rem var(--ui);letter-spacing:.08em;color:var(--o);border:1px solid rgba(255,122,26,.5);border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;flex:0 0 auto}
.dot.off{background:#6b6b75}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;color:#d8d8dd;line-height:1.45}
.rules b{color:var(--o)}

/* fim de rodada */
.melds{display:flex;flex-direction:column;gap:10px}
.meld{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.meld .t{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);width:84px;font-weight:700}
.score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.score td{padding:8px 4px;border-bottom:1px solid var(--line)}
.score td:last-child{text-align:right;color:var(--o);font-weight:800}

/* gavetas */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:var(--text);border:1px solid var(--o);padding:10px 16px;border-radius:12px;max-width:calc(100% - 40px);font-weight:600;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.7)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.drawer .sheet{background:var(--s1);border-top:2px solid var(--o);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88%;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.hp{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:14px;background:var(--s2)}
.hp .cards{display:flex;flex-wrap:wrap;gap:5px}
.hp .hl{font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.chron{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:8px}
.chron li{padding-left:2px}
.chron li::marker{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.chron .ln{display:flex;align-items:center;gap:10px}
.chron b{color:var(--text)}
.chron .lx{color:var(--o)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="drawer" class="drawer" hidden></div>
<div id="alarm" class="alarm" role="alert" hidden></div>

<script>
(() => {
/* =================== cartas e regras =================== */
const RANKS = "A23456789TJQK", SUITS = "SHDC";
const SYM = {S:"♠",H:"♥",D:"♦",C:"♣"};
const rk = c => c[0], st = c => c[1];
const rv = c => RANKS.indexOf(c[0]) + 1;
const rlabel = r => r === "T" ? "10" : r;
const nextRank = r => RANKS[(RANKS.indexOf(r) + 1) % 13];
const isRed = c => st(c) === "H" || st(c) === "D";
const cardName = c => rlabel(rk(c)) + SYM[st(c)];
// Coringas: a outra cópia da vira e a carta seguinte do mesmo naipe (as duas cópias).
const jokersFor = vira => [rk(vira) + st(vira), nextRank(rk(vira)) + st(vira)];
const isJ = (c, J) => J.includes(c.slice(0,2));
function rnd(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newDeck(){ const d=[]; for(const cp of [1,2]) for(const s of SUITS) for(const r of RANKS) d.push(r+s+cp); return shuffle(d); }

function meldType(cards, J){
  const n = cards.length;
  const nat = cards.filter(c => !isJ(c, J));
  if (nat.length === 0) return "coringas";
  if (nat.every(c => rk(c) === rk(nat[0]))) {
    const cnt = {}; nat.forEach(c => cnt[st(c)] = (cnt[st(c)]||0) + 1);
    const vals = Object.values(cnt);
    if (n === 3 && vals.every(v => v === 1)) return "trinca";
    if (n === 4 && vals.length <= 3 && vals.every(v => v <= 2) && vals.filter(v => v === 2).length <= 1) return "trinca + 1";
  }
  if (nat.every(c => st(c) === st(nat[0]))) {
    for (let s = 1; s + n - 1 <= 14; s++) {
      const hi = s + n - 1, used = new Set(); let ok = true;
      for (const c of nat) {
        const v = rv(c); let p = null;
        if (v === 1) { if (s <= 1) p = 1; else if (hi >= 14) p = 14; }
        else if (v >= s && v <= hi) p = v;
        if (p === null || used.has(p)) { ok = false; break; }
        used.add(p);
      }
      if (ok) return "sequência";
    }
  }
  return null;
}
function findBatida(hand, J){
  if (!hand || hand.length !== 10) return null;
  const idx = [...Array(10).keys()];
  for (let a=0;a<10;a++) for (let b=a+1;b<10;b++) for (let c=b+1;c<10;c++) for (let d=c+1;d<10;d++){
    const four = [a,b,c,d].map(i => hand[i]);
    const t4 = meldType(four, J); if (!t4) continue;
    const rest = idx.filter(i => ![a,b,c,d].includes(i)).map(i => hand[i]);
    for (let i=1;i<6;i++) for (let j=i+1;j<6;j++){
      const g1 = [rest[0], rest[i], rest[j]];
      const g2 = rest.filter((_,k) => k!==0 && k!==i && k!==j);
      const t1 = meldType(g1, J), t2 = meldType(g2, J);
      if (t1 && t2) return [{t:t1,c:g1},{t:t2,c:g2},{t:t4,c:four}];
    }
  }
  return null;
}

/* ---------- agrupar a mão em jogos ---------- */
function popc(m){ let k=0; while(m){ m &= m-1; k++; } return k; }
function aceVal(nat){
  const hi = nat.some(c => rk(c)==="K" || rk(c)==="Q") && !nat.some(c => rk(c)==="2" || rk(c)==="3");
  return c => rk(c)==="A" && hi ? 14 : rv(c);
}
const bySuit = (a,b) => SUITS.indexOf(st(a)) - SUITS.indexOf(st(b));
function sortMeld(cards, t, J){
  const nat = cards.filter(c => !isJ(c,J)), jk = cards.filter(c => isJ(c,J));
  if (t === "sequência" && nat.length){
    const val = aceVal(nat);
    nat.sort((a,b) => val(a)-val(b));
    const out = [nat[0]], pool = jk.slice();
    for (let i=1;i<nat.length;i++){ let g = val(nat[i]) - val(nat[i-1]); while (g > 1 && pool.length){ out.push(pool.shift()); g--; } out.push(nat[i]); }
    if (pool.length){ if (val(nat[nat.length-1]) + pool.length <= 14) out.push(...pool); else out.unshift(...pool); }
    return out;
  }
  return nat.sort(bySuit).concat(jk);
}
function pairScore(a, b){
  if (rk(a) === rk(b)) return st(a) !== st(b) ? 2 : 0;
  if (st(a) !== st(b)) return 0;
  const va = [rv(a)], vb = [rv(b)];
  if (rk(a)==="A") va.push(14); if (rk(b)==="A") vb.push(14);
  let d = 99; for (const x of va) for (const y of vb) d = Math.min(d, Math.abs(x-y));
  return d === 1 ? 3 : d === 2 ? 1 : 0;
}
function groupHand(hand, J){
  const n = hand.length; if (!n) return [];
  const byLow = Array.from({length:n}, () => []);
  for (let m=1; m<(1<<n); m++){
    const k = popc(m); if (k < 3 || k > 6) continue;
    const sub = []; let low = -1;
    for (let i=0;i<n;i++) if (m>>i & 1){ sub.push(hand[i]); if (low < 0) low = i; }
    const t = meldType(sub, J); if (!t) continue;
    byLow[low].push({m, t, k, jk: sub.filter(c => isJ(c,J)).length, cards: sub});
  }
  let best = {cov:-1, jk:0, list:[]};
  const rec = (i, used, cov, jk, list) => {
    if (cov + (n - i) < best.cov) return;
    if (i === n){ if (cov > best.cov || (cov === best.cov && jk < best.jk)) best = {cov, jk, list: list.slice()}; return; }
    if (used>>i & 1) return rec(i+1, used, cov, jk, list);
    for (const v of byLow[i]) if (!(v.m & used)){ list.push(v); rec(i+1, used|v.m, cov+v.k, jk+v.jk, list); list.pop(); }
    rec(i+1, used, cov, jk, list);
  };
  rec(0, 0, 0, 0, []);
  const groups = best.list.map(v => ({kind:"jogo", t:v.t, cards: sortMeld(v.cards, v.t, J)}));
  const inMeld = new Set(best.list.flatMap(v => v.cards));
  const left = hand.filter(c => !inMeld.has(c));
  const nat = left.filter(c => !isJ(c,J)), jks = left.filter(c => isJ(c,J));
  const cand = [];
  for (let a=0;a<nat.length;a++) for (let b=a+1;b<nat.length;b++){ const s = pairScore(nat[a], nat[b]); if (s) cand.push([s, nat[a], nat[b]]); }
  cand.sort((x,y) => y[0]-x[0]);
  const taken = new Set();
  for (const [, a, b] of cand){
    if (taken.has(a) || taken.has(b)) continue;
    taken.add(a); taken.add(b);
    const val = aceVal([a,b]);
    groups.push({kind:"par", cards: rk(a)===rk(b) ? [a,b].sort(bySuit) : [a,b].sort((x,y) => val(x)-val(y))});
  }
  jks.forEach(c => groups.push({kind:"coringa", cards:[c]}));
  nat.filter(c => !taken.has(c)).sort((a,b) => rv(a)-rv(b) || bySuit(a,b)).forEach(c => groups.push({kind:"solta", cards:[c]}));
  return groups;
}

/* =================== anfitrião: regras do jogo =================== */
function emptyState(){ return {status:"lobby", players:[], wins:{}, round:0}; }
const pIdx = (s, id) => s.players.findIndex(p => p.id === id);
const nickOf = (s, id) => (s.players.find(p => p.id === id) || {}).nick || "Alguém";
function fail(msg){ throw new Error(msg); }
function deal(s){
  const deck = newDeck();
  s.hands = {};
  s.players.forEach(p => s.hands[p.id] = deck.splice(0,9));
  s.vira = deck.pop();
  s.jokers = jokersFor(s.vira);
  s.discard = [];               // o jogo começa sem lixo
  s.stock = deck;
  s.turn = (s.dealer + 1) % s.players.length;
  s.phase = "draw"; s.drawn = null; s.status = "playing"; s.result = null;
  s.first = true; s.canSwap = false; s.claim = null;
  s.hist = [];
  s.round = (s.round || 0) + 1;
  s.log = "Rodada " + s.round + ": " + nickOf(s, s.players[s.dealer].id) + " deu as cartas.";
}
const isTurn = (s, pid) => s.status === "playing" && s.players[s.turn] && s.players[s.turn].id === pid;
function refillStock(s){
  if (s.stock.length) return;
  const top = s.discard.pop();
  s.stock = shuffle(s.discard); s.discard = top ? [top] : [];
  s.hist.push({a:"r"});
  if (!s.stock.length) fail("Acabaram as cartas do monte.");
}

function apply(pid, m){
  const s = S;
  if (s.claim && ["draw","discard","swap","bater"].includes(m.a)) fail("Espere: alguém pediu para bater com o lixo.");
  switch (m.a) {
    case "hello": {
      const nk = String(m.nick || "").trim().slice(0,14) || "Jogador";
      const i = pIdx(s, pid);
      if (i >= 0) { s.players[i].nick = nk; break; }
      if (s.status !== "lobby") break;
      if (s.players.length >= 6) fail("A mesa já tem 6 jogadores. Você vai assistir.");
      s.players.push({id: pid, nick: nk});
      if (s.wins[pid] == null) s.wins[pid] = 0;
      break;
    }
    case "addBot": {
      if (pid !== PID) fail("Só o anfitrião pode adicionar bots.");
      if (s.status !== "lobby") fail("Só dá para adicionar bots antes de começar.");
      const qtd = m.fill ? 6 - s.players.length : 1;
      if (qtd <= 0 || s.players.length >= 6) fail("A mesa já tem 6 jogadores.");
      for (let k = 0; k < qtd; k++) {
        const usados = new Set(s.players.map(p => p.nick));
        const nome = BOT_NAMES.find(n => !usados.has(n)) || ("Bot " + (s.players.length + 1));
        const id = "bot-" + Math.random().toString(36).slice(2,8);
        s.players.push({id, nick: nome, bot: true});
        s.wins[id] = s.wins[id] || 0;
      }
      break;
    }
    case "remove":
      if (s.status !== "lobby") fail("Só dá para tirar jogadores antes de começar.");
      if (m.id === PID && pid !== PID) fail("O anfitrião não pode ser tirado.");
      s.players = s.players.filter(p => p.id !== m.id); break;
    case "start":
      if (s.status !== "lobby") return;
      if (s.players.length < 2) fail("Precisa de pelo menos 2 jogadores.");
      if (pIdx(s, pid) < 0) fail("Entre na mesa antes de começar.");
      s.dealer = rnd(s.players.length); deal(s); break;
    case "next":
      if (s.status !== "roundEnd") return;
      s.dealer = (s.dealer + 1) % s.players.length; deal(s); break;
    case "lobby":
      if (pIdx(s, pid) < 0) fail("Só quem está na mesa pode encerrar.");
      Object.assign(s, {status:"lobby", hands:null, stock:null, discard:null, result:null, log:null, drawn:null, hist:[], claim:null});
      break;
    case "clockPause": {
      if (!s.clockStart) fail("O relógio começa na primeira compra de carta.");
      if (pIdx(s, pid) < 0) fail("Só quem está na mesa pode pausar o relógio.");
      const now = Date.now();
      if (s.pausedAt) { s.pausedTotal = (s.pausedTotal || 0) + (now - s.pausedAt); s.pausedAt = null; }
      else s.pausedAt = now;
      s.clockBy = pid;
      break;
    }
    case "setLimit":
      if (pid !== PID) fail("Só o anfitrião muda o alerta de tempo.");
      s.limitMin = Math.max(0, Math.min(600, Math.round(Number(m.min) || 0)));
      break;
    case "zerar":
      s.wins = {}; s.players.forEach(p => s.wins[p.id] = 0); break;
    case "draw": {
      if (!isTurn(s, pid) || s.phase !== "draw") fail("Não é hora de comprar.");
      let c;
      if (m.from === "lixo") {
        if (!s.discard.length) fail("O lixo está vazio.");
        c = s.discard.pop();
        s.hist.push({p:pid, a:"l", c});
      } else {
        refillStock(s);
        c = s.stock.pop();
      }
      if (!s.clockStart) s.clockStart = Date.now();   // relógio começa na primeira compra
      s.hands[pid].push(c); s.phase = "discard"; s.drawn = c;
      s.canSwap = !!s.first && m.from !== "lixo";
      s.log = nickOf(s, pid) + (m.from === "lixo" ? " pegou " + cardName(c) + " do lixo." : " comprou do monte.");
      break;
    }
    case "swap": {
      if (!isTurn(s, pid) || s.phase !== "discard" || !s.canSwap) fail("Essa troca só vale na primeira compra da rodada.");
      const h = s.hands[pid], i = h.indexOf(s.drawn);
      if (i < 0) fail("Não achei a carta comprada.");
      const old = s.drawn;
      h.splice(i,1); s.discard.push(old);
      s.hist.push({p:pid, a:"t", c:old});
      refillStock(s);
      const c2 = s.stock.pop();
      h.push(c2); s.drawn = c2; s.canSwap = false;
      s.log = nickOf(s, pid) + " descartou " + cardName(old) + " e comprou outra.";
      break;
    }
    case "discard": {
      if (!isTurn(s, pid) || s.phase !== "discard") fail("Compre uma carta antes de descartar.");
      const h = s.hands[pid], i = h.indexOf(m.card);
      if (i < 0) fail("Essa carta não está na sua mão.");
      h.splice(i,1); s.discard.push(m.card);
      s.hist.push({p:pid, a:"d", c:m.card});
      s.turn = (s.turn + 1) % s.players.length; s.phase = "draw"; s.drawn = null;
      s.first = false; s.canSwap = false;
      s.log = nickOf(s, pid) + " descartou " + cardName(m.card) + ".";
      break;
    }
    case "bater": {
      if (!isTurn(s, pid) || s.phase !== "discard") fail("Você só bate logo depois de comprar.");
      const melds = findBatida(s.hands[pid], s.jokers);
      if (!melds) fail("Essas 10 cartas ainda não formam 3 + 3 + 4.");
      const limpa = !!findBatida(s.hands[pid], []);
      s.wins[pid] = (s.wins[pid] || 0) + 1;
      s.status = "roundEnd"; s.result = {winner: pid, melds, limpa};
      s.first = false; s.canSwap = false;
      s.log = nickOf(s, pid) + " bateu!";
      break;
    }
    case "baterLixo": {
      const last = s.hist && s.hist[s.hist.length-1];
      if (s.status !== "playing" || s.phase !== "draw" || !s.discard.length || !last || last.a !== "d") fail("Não dá para bater com o lixo agora.");
      if (last.p === pid) fail("Você não pode bater com a carta que você mesmo descartou.");
      if (!canBaterLixo(s, pid)) fail("Essa carta não fecha a sua batida.");
      if (!s.claim) s.claim = {ids: [], from: last.p};
      if (!s.claim.ids.includes(pid)) s.claim.ids.push(pid);
      const best = bestEligible(s);
      if (!best || s.claim.ids.includes(best)) finishClaim(s);     // quem tem a preferência já pediu
      else { s.log = nickOf(s, pid) + " pediu para bater com " + cardName(s.discard[s.discard.length-1]) + "…"; armClaim(); }
      break;
    }
    default: return;
  }
  saveHost(); broadcast();
}
/* ---------- batida com o lixo: preferência para quem vem antes na rodada ---------- */
const CLAIM_MS = window.__claimMs || 3000;
let claimTimer = null;
const lastDiscarder = s => { const e = s.hist && s.hist[s.hist.length-1]; return e && e.a === "d" ? e.p : null; };
function orderDist(s, id, from){ const n = s.players.length; return (pIdx(s, id) - pIdx(s, from) + n) % n; }
function canBaterLixo(s, id){
  const top = s.discard && s.discard[s.discard.length-1];
  return !!(top && s.hands && s.hands[id] && s.hands[id].length === 9 && findBatida(s.hands[id].concat(top), s.jokers));
}
function bestEligible(s){
  const from = s.claim ? s.claim.from : lastDiscarder(s);
  const el = s.players.map(p => p.id).filter(id => id !== from && canBaterLixo(s, id));
  el.sort((a,b) => orderDist(s, a, from) - orderDist(s, b, from));
  return el[0] || null;
}
function finishClaim(s){
  if (claimTimer) { clearTimeout(claimTimer); claimTimer = null; }
  const from = s.claim.from;
  const ids = s.claim.ids.filter(id => canBaterLixo(s, id)).sort((a,b) => orderDist(s, a, from) - orderDist(s, b, from));
  s.claim = null;
  const pid = ids[0];
  if (!pid) return;
  const top = s.discard.pop();
  const h10 = s.hands[pid].concat(top);
  const melds = findBatida(h10, s.jokers);
  const fora = !isTurn(s, pid);
  s.hands[pid] = h10;
  s.hist.push({p:pid, a:"l", c:top, fora:true});
  s.wins[pid] = (s.wins[pid] || 0) + 1;
  s.status = "roundEnd";
  s.result = {winner: pid, melds, limpa: !!findBatida(h10, []), fora, card: top, from, rivals: ids.slice(1)};
  s.first = false; s.canSwap = false;
  s.log = nickOf(s, pid) + (fora ? " bateu de fora com " : " bateu com ") + cardName(top) + " do lixo!";
}
function armClaim(){
  if (claimTimer) return;
  claimTimer = setTimeout(() => {
    claimTimer = null;
    if (mode === "host" && S && S.claim && S.status === "playing") { finishClaim(S); saveHost(); broadcast(); }
  }, CLAIM_MS);
}
function hostHandle(pid, m){
  try { apply(pid, m); }
  catch (e) { sendErr(pid, e.message || "Não deu certo."); if (pid !== PID) broadcast(); }
}
function sendErr(pid, msg){
  if (pid === PID) { toast(msg); return; }
  const c = conns.get(pid); if (c && c.open) c.send({t:"err", msg});
}
function viewFor(pid){
  const s = S;
  const mine = s.hands && s.hands[pid] ? s.hands[pid] : null;
  return {
    status: s.status, code: CODE, me: pid, host: PID, round: s.round || 0,
    dealer: s.dealer, turn: s.turn, phase: s.phase, log: s.log || "",
    players: s.players.map(p => ({id:p.id, nick:p.nick, bot:!!p.bot, wins:s.wins[p.id]||0,
      count: s.hands && s.hands[p.id] ? s.hands[p.id].length : 0,
      online: p.bot || p.id === PID || !!(conns.get(p.id) && conns.get(p.id).open)})),
    hand: mine ? mine.slice() : null,
    top: s.discard && s.discard.length ? s.discard[s.discard.length-1] : null,
    stock: s.stock ? s.stock.length : 0,
    vira: s.vira || null, jokers: s.jokers || [],
    drawn: isTurn(s, pid) ? s.drawn : null,
    canSwap: isTurn(s, pid) && !!s.canSwap,
    hist: s.hist || [],
    claim: s.claim ? {ids: s.claim.ids.slice(), from: s.claim.from} : null,
    clk: {el: s.clockStart ? (s.pausedAt || Date.now()) - s.clockStart - (s.pausedTotal || 0) : null, lim: s.limitMin || 0, paused: !!s.pausedAt, by: s.clockBy || null},
    result: s.status === "roundEnd" ? s.result : null,
  };
}
/* ---------- bots (jogam no aparelho do anfitrião) ---------- */
const BOT_NAMES = ["Bot Zé","Bot Tina","Bot Dito","Bot Lia","Bot Juca","Bot Nena"];
const BOT_DELAY = window.__botDelay || 1100;
let botTimer = null;
function handScore(h, Jk){
  let sc = 0;
  for (const g of groupHand(h, Jk)) {
    if (g.kind === "jogo") sc += g.cards.length * 3;
    else if (g.kind === "par") sc += 2;
    else if (g.kind === "coringa") sc += 2.5;
  }
  return sc;
}
function bestDiscard(h, Jk, keep){
  let best = null, bs = -Infinity;
  for (const c of h) {
    if (isJ(c, Jk) || c === keep) continue;
    const sc = handScore(h.filter(x => x !== c), Jk) + Math.random() * 0.3;
    if (sc > bs) { bs = sc; best = c; }
  }
  if (!best) best = h.find(c => c !== keep) || h[0];
  return {card: best, score: bs};
}
function botPlay(){
  botTimer = null;
  if (mode !== "host" || !S || S.status !== "playing" || S.claim) return;
  const p = S.players[S.turn];
  if (!p || !p.bot) return;
  const id = p.id, Jk = S.jokers, h = S.hands[id];
  try {
    if (S.phase === "draw") {
      const top = S.discard[S.discard.length - 1];
      let lixo = false;
      if (top) {
        const h10 = h.concat(top);
        if (findBatida(h10, Jk) || isJ(top, Jk)) lixo = true;
        else lixo = bestDiscard(h10, Jk, top).score - handScore(h, Jk) >= 2;
      }
      hostHandle(id, {a:"draw", from: lixo ? "lixo" : "monte"});
    } else {
      if (findBatida(h, Jk)) { hostHandle(id, {a:"bater"}); return; }
      const d = bestDiscard(h, Jk);
      if (S.canSwap) {
        const sem = h.filter(c => c !== S.drawn);
        if (d.score - handScore(sem, Jk) < 2) { hostHandle(id, {a:"swap"}); return; }
      }
      hostHandle(id, {a:"discard", card: d.card});
    }
  } catch (e) {
    const c = h.find(x => !isJ(x, Jk)) || h[0];
    try { hostHandle(id, S.phase === "draw" ? {a:"draw", from:"monte"} : {a:"discard", card:c}); } catch(_){}
  }
}
let botClaimTimer = null;
function scheduleBot(){
  if (mode !== "host" || !S || S.status !== "playing") return;
  const jitter = () => rnd(Math.max(1, Math.round(BOT_DELAY * .5)));
  const from = lastDiscarder(S);
  const fresh = S.phase === "draw" && S.discard.length && from;
  if (fresh && !botClaimTimer) {
    const bestNow = S.claim && S.claim.ids.length ? Math.min(...S.claim.ids.map(id => orderDist(S, id, from))) : Infinity;
    const cands = S.players.filter(q => q.bot && q.id !== from && !(S.claim && S.claim.ids.includes(q.id))
      && orderDist(S, q.id, from) < bestNow && canBaterLixo(S, q.id))
      .sort((a,b) => orderDist(S, a.id, from) - orderDist(S, b.id, from));
    if (cands.length) {
      const q = cands[0];
      const delay = S.claim ? 300 + rnd(400) : Math.round(BOT_DELAY * 1.2) + jitter();
      botClaimTimer = setTimeout(() => { botClaimTimer = null; hostHandle(q.id, {a:"baterLixo"}); }, delay);
      return;
    }
  }
  if (S.claim || botTimer) return;
  const p = S.players[S.turn];
  // depois de um descarte, o bot espera mais para dar tempo de alguém bater de fora
  if (p && p.bot) botTimer = setTimeout(botPlay, BOT_DELAY + (fresh ? Math.round(BOT_DELAY * 1.3) : 0) + jitter());
}

function broadcast(){
  for (const [pid, c] of conns) if (c.open) { try { c.send({t:"view", v: viewFor(pid)}); } catch(e){} }
  V = viewFor(PID); render();
  scheduleBot();
}
function saveHost(){ lsSet("cacheta-host", JSON.stringify({code: CODE, pid: PID, s: S})); }
function migrate(s){
  if (!s) return s;

  if (s.claim && s.status === "playing") { try { finishClaim(s); } catch(e) { s.claim = null; } }
  return s;
}

/* =================== anfitrião: rede =================== */
let hostTries = 0;
function startHost(code, state){
  mode = "host"; CODE = code; S = migrate(state); V = viewFor(PID);
  history.replaceState(null, "", location.pathname + "?mesa=" + CODE);
  saveHost(); net = "Abrindo a mesa…"; render(); wakeLock(); scheduleBot();
  if (typeof Peer === "undefined") { net = "Sem internet: não consegui carregar a conexão."; render(); return; }
  peer = new Peer(peerIdFor(CODE), PEER_OPTS);
  peer.on("open", () => { hostTries = 0; net = ""; render(); });
  peer.on("connection", c => {
    c.on("data", d => {
      if (!d || typeof d !== "object") return;
      if (d.t === "hello") {
        const pid = String(d.pid || "").slice(0,24);
        if (!pid || pid === PID) { c.send({t:"err", msg:"Este aparelho já é o anfitrião."}); return; }
        const old = conns.get(pid); if (old && old !== c) { try { old.close(); } catch(e){} }
        c.pid = pid; conns.set(pid, c);
        hostHandle(pid, {a:"hello", nick:d.nick});
        broadcast();
      } else if (d.t === "act" && c.pid && conns.get(c.pid) === c) {
        hostHandle(c.pid, d);
      }
    });
    c.on("close", () => { if (c.pid && conns.get(c.pid) === c) { conns.delete(c.pid); broadcast(); } });
    c.on("error", () => {});
  });
  peer.on("disconnected", () => { net = "Reconectando ao servidor…"; render(); setTimeout(() => { try { peer.reconnect(); } catch(e){} }, 1500); });
  peer.on("error", e => {
    if (e.type === "unavailable-id") {
      hostTries++;
      net = "Reabrindo a mesa " + CODE + "…"; render();
      try { peer.destroy(); } catch(_){}
      if (hostTries < 12) setTimeout(() => startHost(CODE, S), 3000);
      else { net = "Não consegui reabrir a mesa. Crie uma nova."; render(); }
    } else if (["network","server-error","socket-error","socket-closed"].includes(e.type)) {
      net = "Sem conexão. Tentando de novo…"; render();
    }
  });
}
setInterval(() => { if (mode === "host") for (const c of conns.values()) if (c.open) { try { c.send({t:"ping"}); } catch(e){} } }, 5000);

/* =================== convidado: rede =================== */
function startClient(code){
  mode = "client"; CODE = code; V = null; net = "Procurando a mesa " + CODE + "…";
  history.replaceState(null, "", location.pathname + "?mesa=" + CODE);
  lsSet("cacheta-guest", CODE);
  render(); wakeLock();
  if (typeof Peer === "undefined") { net = "Sem internet: não consegui carregar a conexão."; render(); return; }
  peer = new Peer(PEER_OPTS);
  peer.on("open", () => connectClient());
  peer.on("disconnected", () => { setTimeout(() => { try { peer.reconnect(); } catch(e){} }, 1500); });
  peer.on("error", e => {
    if (e.type === "peer-unavailable") { net = V ? "O anfitrião saiu. Esperando ele voltar…" : "Mesa " + CODE + " não encontrada. Confira o código; tentando de novo…"; render(); scheduleRetry(); }
    else if (["network","server-error","socket-error","socket-closed"].includes(e.type)) { net = "Sem conexão. Tentando de novo…"; render(); scheduleRetry(); }
  });
}
function scheduleRetry(){
  if (retryT || mode !== "client") return;
  retryT = setTimeout(() => { retryT = null; connectClient(); }, 3000);
}
function connectClient(){
  if (mode !== "client" || !peer || peer.destroyed) return;
  if (peer.disconnected) { try { peer.reconnect(); } catch(e){} scheduleRetry(); return; }
  if (conn && conn.open) return;
  const c = peer.connect(peerIdFor(CODE), {reliable:true, serialization:"json"});
  let opened = false;
  c.on("open", () => {
    opened = true; conn = c; lastMsg = Date.now();
    c.send({t:"hello", pid:PID, nick:NICK});
    net = ""; render();
  });
  c.on("data", d => {
    lastMsg = Date.now();
    if (!d || typeof d !== "object") return;
    if (d.t === "view") { V = d.v; render(); }
    else if (d.t === "err") toast(d.msg);
  });
  c.on("close", () => { if (conn === c) { conn = null; net = "Conexão caiu. Reconectando…"; render(); scheduleRetry(); } });
  c.on("error", () => {});
  setTimeout(() => { if (!opened) { try { c.close(); } catch(e){} scheduleRetry(); } }, 9000);
}
setInterval(() => {
  if (mode === "client" && conn && Date.now() - lastMsg > 16000) {
    const c = conn; conn = null; try { c.close(); } catch(e){}
    net = "Conexão caiu. Reconectando…"; render(); scheduleRetry();
  }
}, 4000);

/* =================== ações deste aparelho =================== */
function act(a, extra){
  const m = Object.assign({a}, extra || {});
  if (mode === "host") hostHandle(PID, m);

}

let clockBase = null, clockLim = 0, clockV = null, lastCycle = null, alarmT = null, clockPaused = false, clockFrozen = 0;
const clockEl = () => clockPaused ? clockFrozen : Date.now() - clockBase;
const fmtTime = ms => { const t = Math.max(0, Math.floor(ms/1000)), h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${m}:${String(sec).padStart(2,"0")}`; };
function syncClock(){
  if (!V || !V.clk || V === clockV) return;
  clockV = V;
  const lim = V.clk.lim || 0;
  if (lim !== clockLim) { clockLim = lim; lastCycle = null; }
  clockBase = V.clk.el == null ? null : Date.now() - V.clk.el;

}
function clockText(){
  const el = clockEl(), limMs = clockLim * 60000;

}

function beep(){
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const ac = new A(), o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(ac.destination);

}

      <button class="pile ${canDraw?"can":""}" id="pMonte" ${canDraw?"":"disabled"} aria-label="Comprar do monte"><div class="back"></div><span class="lbl">Monte · ${V.stock}</span></button>
      <button class="pile ${canDraw&&V.top?"can":""}" id="pLixo" ${canDraw&&V.top?"":"disabled"} aria-label="Pegar do lixo">${V.top?cardHTML(V.top):'<div class="slot">sem lixo</div>'}<span class="lbl">Lixo</span></button>
      <div class="jk"><div class="pair">${Jk.map(j => cardHTML(j+"0")).join("")}</div><span class="lbl">Coringas</span><span class="vira">vira <b>${V.vira?cardName(V.vira):"—"}</b></span></div>
    </div>
    <div class="trailbox">
      <div class="trailhead"><span class="lbl">Descartes, do mais novo</span><button id="btnHist2">Ver tudo</button></div>
      <div class="trail" id="trail">${recent.length ? recent.map(({e,pk}) => `<div class="t ${pk?"pk":""}">${cardHTML(e.c,"xs")}<span class="w">${pk?"↑ "+esc(nk(pk)):esc(nk(e.p))}</span></div>`).join("") : '<span class="empty">Ninguém descartou ainda.</span>'}</div>
    </div>
  </section>
  <div class="status ${mine||canFora?"mine":""}">${status}</div>
  <div class="log">${esc(V.log)}</div>
  ${meIn ? `
  <div class="handwrap">
    ${canFora ? (iClaimed ? `<button class="fora" disabled>Pedido enviado…</button>` : `<button class="primary fora" id="btnFora">Bater com o ${cardName(V.top)} do lixo${iHavePref?" (você tem a preferência)":""}</button>`) : ""}
    <div class="hand" id="hand">${order.map(c => {
      const m = mark[c];
      const bar = m && (m.kind === "jogo" || m.kind === "par") ? `<span class="gb ${m.kind==="par"?"par":""} ${m.s?"":"jl"} ${m.e?"":"jr"}"></span>` : "";
      const nb = c === V.drawn ? '<span class="nb">nova</span>' : "";
      return cardBtn(c, c===sel?"sel":"", nb + bar);
    }).join("")}</div>
    <div class="gsum">${gsum || (sel ? "Use ◀ ▶ para mudar a carta de lugar." : "Toque numa carta para escolher.")}</div>
    <div class="seg">
      <button data-sort="jogos" class="${sortMode==="jogos"?"on":""}" aria-pressed="${sortMode==="jogos"}">Jogos</button>
      <button data-sort="naipe">Naipe</button>
      <button data-sort="valor">Valor</button>
      <span class="sep"></span>
      <button class="ar" id="mvL" aria-label="Mover carta para a esquerda">◀</button>
      <button class="ar" id="mvR" aria-label="Mover carta para a direita">▶</button>
    </div>
    ${V.canSwap ? `<button class="swap" id="btnSwap">Descartar ${cardName(V.drawn)} e comprar outra</button>` : ""}
    <div class="actions">
      <button id="btnDesc" ${mine&&V.phase==="discard"&&sel?"":"disabled"}>Descartar${sel?" "+cardName(sel):""}</button>
      <button id="btnBater" class="primary ${bat?"ready":""}" ${bat?"":"disabled"}>Bater</button>
    </div>
  </div>` : ""}`;
}
function renderEnd(){
  const r = V.result;
  const rows = [...V.players].sort((a,b) => b.wins - a.wins);
  const nextDealer = V.players[(V.dealer+1) % V.players.length];
  const inTable = V.players.some(p => p.id === V.me);
  return `
  ${topHTML(true)}
  ${netHTML()}
  <section class="panel">
    <div class="eyebrow">Fim da rodada</div>
    <h1 style="font-size:clamp(1.8rem,9vw,2.6rem)">${esc(nk(r.winner))} <em>bateu${r.fora?" de fora":""}${r.limpa?" limpo":""}!</em></h1>
    ${r.card ? `<div class="muted" style="font-size:.88rem">Com o ${cardName(r.card)} que ${esc(nk(r.from))} descartou.${r.rivals && r.rivals.length ? ` ${r.rivals.map(id => esc(nk(id))).join(" e ")} também pediu, mas ${esc(nk(r.winner))} vinha antes na rodada.` : ""}</div>` : ""}
    <div class="melds">${r.melds.map(m => `<div class="meld"><span class="t">${m.t}</span>${sortMeld(m.c, m.t, J()).map(c=>cardHTML(c,"md")).join("")}</div>`).join("")}</div>
    <div class="muted" style="font-size:.85rem">Vira ${V.vira?cardName(V.vira):"—"} · coringas ${J().map(j=>cardName(j+"0")).join(" e ")}</div>
  </section>
  <section class="panel">
    <h2>Placar</h2>
    <table class="score">${rows.map(p=>`<tr><td>${esc(p.nick)}${p.id===V.me?' <span class="muted">(você)</span>':''}</td><td>${p.wins}</td></tr>`).join("")}</table>
    ${inTable ? `<button class="primary" id="btnNext">Próxima rodada · ${esc(nextDealer.nick)} dá as cartas</button>` : ""}
  </section>`;
}
function renderWaiting(){
  return `${topHTML(false)}<section class="panel" style="text-align:center"><div class="codebig">${esc(CODE)}</div><p>${esc(net || "Conectando…")}</p><button id="btnLeave2">Voltar</button></section>`;
}
function render(){
  syncClock();
  let html;
  if (mode === "start") html = renderStart();
  else if (!V) html = renderWaiting();
  else if (V.status === "playing") html = renderGame();
  else if (V.status === "roundEnd") html = renderEnd();
  else html = renderLobby();
  const keepFocus = document.activeElement && document.activeElement.id;
  const limitVal = $("#limit") ? $("#limit").value : null, limEdit = $("#limEdit") ? $("#limEdit").value : null;
  const nickVal = $("#nick") ? $("#nick").value : null, codeVal = $("#code") && $("#code").type !== "hidden" ? $("#code").value : null;
  const trailScroll = $("#trail") ? $("#trail").scrollLeft : 0;
  app.innerHTML = html;
  if (nickVal !== null && $("#nick")) $("#nick").value = nickVal;
  if (limitVal !== null && $("#limit")) $("#limit").value = limitVal;
  if (limEdit !== null && $("#limEdit") && keepFocus === "limEdit") $("#limEdit").value = limEdit;
  if (codeVal !== null && $("#code") && $("#code").type !== "hidden") $("#code").value = codeVal;
  if (keepFocus && document.getElementById(keepFocus) && /^(nick|code|limit|limEdit)$/.test(keepFocus)) document.getElementById(keepFocus).focus();
  if ($("#trail")) $("#trail").scrollLeft = trailScroll;
  bind();
  if (!$("#drawer").hidden && mode !== "start") { if (drawerKind === "hist") openHist(); else if (drawerKind === "menu") openMenu(); }
}
function evText(e){
  const who = `<b>${esc(nk(e.p))}</b>`;
  if (e.a === "d") return `${who} descartou ${cardName(e.c)}`;
  if (e.a === "t") return `${who} recusou a 1ª carta e descartou ${cardName(e.c)}`;
  if (e.a === "l") return `<span class="lx">${who} ${e.fora?"bateu com":"pegou"} ${cardName(e.c)} do lixo</span>`;
  if (e.a === "r") return `O lixo foi embaralhado e virou monte`;
  return "";
}
function openHist(){
  drawerKind = "hist";
  const d = $("#drawer");
  const ev = (V && V.hist) || [];
  let body;
  if (!ev.length) body = `<p class="muted" style="margin:0">Nenhuma carta foi descartada ainda nesta rodada.</p>`;
  else if (histTab === "jog") body = V.players.map(p => {
    const ds = ev.filter(e => e.p === p.id && (e.a === "d" || e.a === "t")).map(e => e.c);
    const ls = ev.filter(e => e.p === p.id && e.a === "l").map(e => e.c);
    return `<div class="hp">
      <div class="row" style="justify-content:space-between"><b>${esc(p.nick)}${p.id===V.me?' <span class="muted">(você)</span>':''}</b><span class="muted" style="font-size:.78rem">${ds.length} ${ds.length===1?"descarte":"descartes"} · ${ls.length} do lixo</span></div>
      <span class="hl">Descartou</span><div class="cards">${ds.length ? ds.map(c => cardHTML(c,"sm")).join("") : '<span class="muted">nada ainda</span>'}</div>
      <span class="hl">Pegou do lixo</span><div class="cards">${ls.length ? ls.map(c => cardHTML(c,"sm")).join("") : '<span class="muted">nada ainda</span>'}</div>
    </div>`;
  }).join("");
  else body = `<ol class="chron" reversed>${ev.slice().reverse().map(e => `<li><div class="ln">${e.c?cardHTML(e.c,"xs"):""}<span>${evText(e)}</span></div></li>`).join("")}</ol>`;
  d.innerHTML = `<div class="sheet" role="dialog" aria-label="Histórico">
    <div class="row" style="justify-content:space-between"><h2>Histórico · rodada ${V?V.round:""}</h2><button id="hClose">Fechar</button></div>
    <div class="seg"><button data-ht="jog" class="${histTab==="jog"?"on":""}">Por jogador</button><button data-ht="ord" class="${histTab==="ord"?"on":""}">Em ordem</button></div>
    ${body}
  </div>`;
  d.hidden = false;
  $("#hClose").onclick = closeDrawer;
  d.onclick = e => { if (e.target === d) closeDrawer(); };
  d.querySelectorAll("[data-ht]").forEach(b => b.onclick = () => { histTab = b.dataset.ht; openHist(); });
}
function openMenu(){
  drawerKind = "menu";
  const d = $("#drawer");
  const isHost = mode === "host";
  const inTable = V && V.players.some(p => p.id === V.me);
  d.innerHTML = `<div class="sheet" role="dialog" aria-label="Mesa">
    <div class="row" style="justify-content:space-between"><h2>Mesa ${esc(CODE)}</h2><button id="mClose">Fechar</button></div>
    ${V ? `<ul class="plist">${V.players.map(p=>`<li><span class="dot ${p.online?"":"off"}"></span><span class="n">${esc(p.nick)}${p.id===V.me?' <span class="muted">(você)</span>':''}</span><span class="w">${p.wins} vit.</span></li>`).join("")}</ul>` : ""}
    ${clockBase != null ? `<div class="muted" style="font-size:.88rem">Relógio da mesa: <b style="color:var(--text)">${fmtTime(clockEl())}</b>${clockPaused ? " (pausado)" : ""}${clockLim ? ` · alerta a cada ${clockLim} min` : ""}</div>
    <button id="mPause">${clockPaused ? "Retomar relógio" : "Pausar relógio"}</button>` : ""}
    <button id="mCopy">Copiar convite</button>
    ${V && V.status !== "lobby" && inTable ? (confirmReset
      ? `<div class="row"><span class="grow">Encerrar a partida para todos? O placar fica.</span><button class="danger" id="mReset">Encerrar</button><button id="mCancel">Cancelar</button></div>`
      : `<button class="danger" id="mAsk">Encerrar partida e voltar ao lobby</button>`) : ""}
    ${confirmLeave
      ? `<div class="row"><span class="grow">${isHost ? "Fechar a mesa? Todo mundo será desconectado." : "Sair desta mesa?"}</span><button class="danger" id="mLeave">Sair</button><button id="mCancel2">Cancelar</button></div>`
      : `<button id="mAskLeave">${isHost ? "Fechar a mesa" : "Sair da mesa"}</button>`}
    <p class="muted" style="margin:0;font-size:.82rem">${isHost ? "Você é o anfitrião: mantenha o app aberto enquanto jogam." : "Se a conexão cair, o app tenta voltar sozinho."}</p>
    ${rulesPanel()}
  </div>`;
  d.hidden = false;
  $("#mClose").onclick = closeDrawer;
  d.onclick = e => { if (e.target === d) closeDrawer(); };
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#mCopy", copyInvite);
  on("#mPause", () => act("clockPause"));
  on("#mAsk", () => { confirmReset = true; openMenu(); });
  on("#mCancel", () => { confirmReset = false; openMenu(); });
  on("#mReset", () => { closeDrawer(); act("lobby"); });
  on("#mAskLeave", () => { confirmLeave = true; openMenu(); });
  on("#mCancel2", () => { confirmLeave = false; openMenu(); });
  on("#mLeave", () => { closeDrawer(); leave(); });
}
function copyInvite(){
  const txt = IS_APP ? "Bora jogar cacheta no PiFengy! Abre o app e entra na mesa " + CODE : "Bora jogar cacheta no PiFengy! Entra na mesa " + CODE + ": " + inviteLink();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Convite copiado. Cole no WhatsApp."), () => toast("Código da mesa: " + CODE));
  else toast("Código da mesa: " + CODE);
}
function readNick(){
  const v = ($("#nick") ? $("#nick").value : NICK).trim().slice(0,14);
  if (!v) { toast("Digite seu apelido."); if ($("#nick")) $("#nick").focus(); return null; }
  NICK = v; lsSet("cacheta-nick", v); return v;
}
function bind(){
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#btnCreate", () => {
    if (!readNick()) return;
    const s = emptyState(); s.players.push({id: PID, nick: NICK}); s.wins[PID] = 0;
    const lim = Math.max(0, Math.min(600, Math.round(Number($("#limit") && $("#limit").value) || 0)));
    s.limitMin = lim; lsSet("cacheta-limit", lim ? String(lim) : "");
    startHost(newCode(), s);
  });
  on("#btnJoin", () => {
    if (!readNick()) return;
    const code = ($("#code").value || "").trim().toUpperCase();
    if (code.length !== 5) { toast("O código tem 5 letras."); return; }
    let saved = null; try { saved = JSON.parse(lsGet("cacheta-host") || "null"); } catch(e){}
    if (saved && saved.code === code) { startHost(code, saved.s); return; }
    startClient(code);
  });
  on("#btnResume", () => {
    let saved = null; try { saved = JSON.parse(lsGet("cacheta-host") || "null"); } catch(e){}
    if (saved) { readNick(); const me = saved.s.players.find(p => p.id === PID); if (me && NICK) me.nick = NICK; startHost(saved.code, saved.s); }
  });
  on("#btnRejoin", () => { if (!readNick()) return; startClient(lsGet("cacheta-guest")); });
  on("#btnLeave2", leave);
  on("#btnCopy", copyInvite);
  on("#btnShare", () => navigator.share({title:"PiFengy", text:"Entra na mesa " + CODE, url: inviteLink()}).catch(()=>{}));
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { if (b.dataset.rm === V.me && mode === "client") { act("remove", {id:b.dataset.rm}); leave(); } else act("remove", {id:b.dataset.rm}); });
  on("#btnBot", () => act("addBot")); on("#btnBotFill", () => act("addBot", {fill:true}));
  on("#btnStart", () => act("start"));
  on("#clock", () => act("clockPause"));
  on("#btnLim", () => { const v = $("#limEdit").value; act("setLimit", {min: v}); toast(Number(v) > 0 ? "Alerta a cada " + Math.round(Number(v)) + " min." : "Alerta de tempo desligado."); }); on("#btnZerar", () => act("zerar")); on("#btnNext", () => act("next"));
  on("#btnMenu", () => { confirmReset = false; confirmLeave = false; openMenu(); });
  on("#btnHist", openHist); on("#btnHist2", openHist); on("#trail", openHist);
  on("#pMonte", () => act("draw", {from:"monte"})); on("#pLixo", () => act("draw", {from:"lixo"}));
  document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    const m = b.dataset.sort;
    if (m === "jogos") { setSort(sortMode === "jogos" ? "livre" : "jogos"); render(); }
    else sortBy(m);
  });
  on("#mvL", () => move(-1)); on("#mvR", () => move(1));
  on("#btnSwap", () => { sel = null; act("swap"); });
  on("#btnDesc", () => { if (sel) { const c = sel; sel = null; act("discard", {card:c}); } });
  on("#btnBater", () => act("bater"));
  on("#btnFora", () => act("baterLixo"));
  const h = $("#hand");
  if (h) h.onclick = e => { const b = e.target.closest("[data-card]"); if (!b) return; sel = sel === b.dataset.card ? null : b.dataset.card; render(); };
  const code = $("#code"); if (code && code.type !== "hidden") code.onkeydown = e => { if (e.key === "Enter") $("#btnJoin").click(); };
}

/* =================== início =================== */
(function boot(){
  const urlCode = (new URLSearchParams(location.search).get("mesa") || "").toUpperCase();
  let saved = null; try { saved = JSON.parse(lsGet("cacheta-host") || "null"); } catch(e){}
  if (urlCode && saved && saved.code === urlCode && saved.pid === PID) { startHost(urlCode, saved.s); return; }
  if (urlCode && NICK && lsGet("cacheta-guest") === urlCode) { startClient(urlCode); return; }
  render();
})();
})();
</script>
</body>
</html>
