<html lang="pt-BR">
<head>

<style>
/* Layout: mesa de feltro em tela única para celular — adversários no topo, monte/lixo/vira no centro, sua mão em grade 5×2 embaixo. Tema escuro fixo (feltro), por escolha. */
:root{
  --felt:#123629; --felt-hi:#1b4a39; --felt-lo:#0b261d;
  --ivory:#f7f1e3; --ink:#1c1915;
  --red:#b4262a; --gold:#e7b44f; --mint:#a9cdbd; --line:rgba(231,180,79,.28);
  --display:"Bodoni Moda",Georgia,"Times New Roman",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 35%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));background-color:var(--felt);background-attachment:fixed;color:var(--ivory);font-family:var(--ui);font-size:15px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.4rem;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--gold);font-weight:600}
.muted{color:var(--mint)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ivory);padding:10px 14px;font-weight:600;min-height:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}
button.danger{border-color:rgba(180,38,42,.7);color:#f2b8b5}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ivory);min-height:44px;min-width:0}
input.code{text-transform:uppercase;letter-spacing:.3em;font-weight:700;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--mint);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .brand{font-family:var(--display);font-weight:800;font-size:1.35rem}
.menu-btn{min-height:38px;padding:6px 12px}
.net{font-size:.8rem;text-align:center;color:var(--gold)}
.codebig{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:.18em;color:var(--gold);text-align:center}

.opps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.opp{flex:1 0 74px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:rgba(0,0,0,.2);display:flex;flex-direction:column;gap:2px;min-width:0}
.opp .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem}
.opp .meta{font-size:.74rem;color:var(--mint);font-variant-numeric:tabular-nums}
.opp.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(231,180,79,.12)}
.opp.off{opacity:.5}
.backs{display:flex;height:14px}
.backs i{width:9px;height:14px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--red) 0 2px,#7d1a1d 2px 4px);border:1px solid var(--ivory);margin-right:-4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5fd38d;margin-right:4px;vertical-align:middle}
.dot.off{background:#8a8a8a}

.table{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;justify-items:center;padding:6px 0}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;min-height:0;border-radius:10px}
.pile .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mint);font-weight:600}
.pile.can .card,.pile.can .back{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.4)}
.back{width:64px;height:92px;border-radius:8px;border:3px solid var(--ivory);background:repeating-linear-gradient(45deg,var(--red) 0 4px,#7d1a1d 4px 8px);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.slot{width:64px;height:92px;border-radius:8px;border:2px dashed var(--line)}
.cor{font-size:.78rem;color:var(--gold);font-weight:600;text-align:center}

.card{position:relative;width:64px;height:92px;border-radius:8px;background:var(--ivory);color:var(--ink);border:1px solid #d8cfbb;box-shadow:0 4px 10px rgba(0,0,0,.35);font-family:var(--display);display:block;padding:0;min-height:0}
.card.red{color:var(--red)}
.card .r{position:absolute;top:4px;left:6px;font-weight:800;font-size:1.25rem;line-height:1}
.card .s1{position:absolute;top:24px;left:7px;font-size:.9rem;line-height:1;font-family:var(--ui)}
.card .s{position:absolute;right:6px;bottom:4px;font-size:1.9rem;line-height:1;font-family:var(--ui)}
.card.joker{border:2px solid var(--gold)}
.card.joker::after{content:"★";position:absolute;top:3px;right:5px;color:#b07d14;font-size:.85rem;font-family:var(--ui)}
.card.sm{width:42px;height:60px;border-radius:6px}
.card.sm .r{font-size:.95rem;top:3px;left:4px}
.card.sm .s1{display:none}
.card.sm .s{font-size:1.25rem;right:4px;bottom:2px}
.card.sm.joker::after{font-size:.7rem;top:2px;right:3px}

.status{text-align:center;font-weight:600;min-height:1.4em}
.status.mine{color:var(--gold)}
.log{text-align:center;font-size:.8rem;color:var(--mint);min-height:1.2em}

.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;justify-items:center;padding-top:10px}
.hand .card{width:100%;max-width:68px;aspect-ratio:64/92;height:auto;transition:transform .12s}
.hand .card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 10px 18px rgba(0,0,0,.45)}
.hand .card.new::before{content:"nova";position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font:600 .62rem var(--ui);color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tools button{min-height:38px;padding:6px 10px;font-size:.85rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{min-height:52px;font-size:1.05rem}
#btnBater.ready{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(231,180,79,0)}to{box-shadow:0 0 0 6px rgba(231,180,79,.35)}}
@media (prefers-reduced-motion:reduce){#btnBater.ready{animation:none}.hand .card{transition:none}}

.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.2)}
.plist li .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li .w{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.plist li button{min-height:34px;padding:4px 10px;font-size:.8rem}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:#e6dfcf;line-height:1.45}
.rules b{color:var(--gold)}

.melds{display:flex;flex-direction:column;gap:8px}
.meld{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.meld .t{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mint);width:76px}
.score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.score td{padding:6px 4px;border-bottom:1px solid var(--line)}
.score td:last-child{text-align:right;color:var(--gold);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ivory);border:1px solid var(--gold);padding:10px 16px;border-radius:10px;max-width:calc(100% - 48px);font-weight:600;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.drawer .sheet{background:var(--felt);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:85%;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="drawer" class="drawer" hidden></div>

<script>
(() => {
/* =================== cartas e regras =================== */
const RANKS = "A23456789TJQK", SUITS = "SHDC";
const SYM = {S:"♠",H:"♥",D:"♦",C:"♣"};
const rk = c => c[0], st = c => c[1];
const rv = c => RANKS.indexOf(c[0]) + 1;
const rlabel = r => r === "T" ? "10" : r;
const nextRank = r => RANKS[(RANKS.indexOf(r) + 1) % 13];
const isRed = c => st(c) === "H" || st(c) === "D";
const cardName = c => rlabel(rk(c)) + SYM[st(c)];
function rnd(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newDeck(){ const d=[]; for(const cp of [1,2]) for(const s of SUITS) for(const r of RANKS) d.push(r+s+cp); return shuffle(d); }

function meldType(cards, cor){
  const n = cards.length;
  const nat = cards.filter(c => rk(c) !== cor);
  if (nat.length === 0) return "coringas";
  if (nat.every(c => rk(c) === rk(nat[0]))) {
    const cnt = {}; nat.forEach(c => cnt[st(c)] = (cnt[st(c)]||0) + 1);
    const vals = Object.values(cnt);
    if (n === 3 && vals.every(v => v === 1)) return "trinca";
    if (n === 4 && vals.length <= 3 && vals.every(v => v <= 2) && vals.filter(v => v === 2).length <= 1) return "trinca + 1";
  }
  if (nat.every(c => st(c) === st(nat[0]))) {
    for (let s = 1; s + n - 1 <= 14; s++) {
      const hi = s + n - 1, used = new Set(); let ok = true;
      for (const c of nat) {
        const v = rv(c); let p = null;
        if (v === 1) { if (s <= 1) p = 1; else if (hi >= 14) p = 14; }
        else if (v >= s && v <= hi) p = v;
        if (p === null || used.has(p)) { ok = false; break; }
        used.add(p);
      }
      if (ok) return "sequência";
    }
  }
  return null;
}
function findBatida(hand, cor){
  if (!hand || hand.length !== 10) return null;
  const idx = [...Array(10).keys()];
  for (let a=0;a<10;a++) for (let b=a+1;b<10;b++) for (let c=b+1;c<10;c++) for (let d=c+1;d<10;d++){
    const four = [a,b,c,d].map(i => hand[i]);
    const t4 = meldType(four, cor); if (!t4) continue;
    const rest = idx.filter(i => ![a,b,c,d].includes(i)).map(i => hand[i]);
    for (let i=1;i<6;i++) for (let j=i+1;j<6;j++){
      const g1 = [rest[0], rest[i], rest[j]];
      const g2 = rest.filter((_,k) => k!==0 && k!==i && k!==j);
      const t1 = meldType(g1, cor), t2 = meldType(g2, cor);
      if (t1 && t2) return [{t:t1,c:g1},{t:t2,c:g2},{t:t4,c:four}];
    }
  }
  return null;
}

/* =================== utilidades =================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const newCode = () => Array.from({length:5}, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join("");
const peerIdFor = code => "cacheta-mesa-" + code.toLowerCase();
const PEER_OPTS = {debug:0, config:{iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80", username:"openrelayproject", credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp", username:"openrelayproject", credential:"openrelayproject"}
]}};

let PID = lsGet("cacheta-pid");
if (!PID) { PID = "p" + Math.random().toString(36).slice(2,10); lsSet("cacheta-pid", PID); }
let NICK = lsGet("cacheta-nick") || "";

/* =================== estado =================== */
let mode = "start";        // start | host | client
let CODE = null;
let peer = null;
let S = null;              // estado completo (só no anfitrião)
const conns = new Map();   // pid -> conexão (anfitrião)
let conn = null;           // conexão com o anfitrião (convidado)
let V = null;              // o que este aparelho enxerga
let net = "";              // aviso de conexão
let sel = null, order = [], confirmLeave = false, confirmReset = false;
let lastMsg = 0, retryT = null;

function wakeLock(){ try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); } catch(e){} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  wakeLock();
  if (peer && peer.disconnected && !peer.destroyed) { try { peer.reconnect(); } catch(e){} }
  if (mode === "client" && !conn) connectClient();
});

/* =================== anfitrião: regras do jogo =================== */
function emptyState(){ return {status:"lobby", players:[], wins:{}, round:0}; }
const pIdx = (s, id) => s.players.findIndex(p => p.id === id);
const nickOf = (s, id) => (s.players.find(p => p.id === id) || {}).nick || "Alguém";
function fail(msg){ throw new Error(msg); }
function deal(s){
  const deck = newDeck();
  s.hands = {};
  s.players.forEach(p => s.hands[p.id] = deck.splice(0,9));
  s.vira = deck.pop(); s.cor = nextRank(rk(s.vira));
  s.discard = [deck.pop()]; s.stock = deck;
  s.turn = (s.dealer + 1) % s.players.length;
  s.phase = "draw"; s.drawn = null; s.status = "playing"; s.result = null;
  s.round = (s.round || 0) + 1;
  s.log = "Rodada " + s.round + ": " + nickOf(s, s.players[s.dealer].id) + " deu as cartas.";
}
const isTurn = (s, pid) => s.status === "playing" && s.players[s.turn] && s.players[s.turn].id === pid;

function apply(pid, m){
  const s = S;
  switch (m.a) {
    case "hello": {
      const nk = String(m.nick || "").trim().slice(0,14) || "Jogador";
      const i = pIdx(s, pid);
      if (i >= 0) { s.players[i].nick = nk; break; }
      if (s.status !== "lobby") break; // entra como espectador
      if (s.players.length >= 6) fail("A mesa já tem 6 jogadores. Você vai assistir.");
      s.players.push({id: pid, nick: nk});
      if (s.wins[pid] == null) s.wins[pid] = 0;
      break;
    }
    case "remove":
      if (s.status !== "lobby") fail("Só dá para tirar jogadores antes de começar.");
      if (m.id === PID && pid !== PID) fail("O anfitrião não pode ser tirado.");
      s.players = s.players.filter(p => p.id !== m.id); break;
    case "start":
      if (s.status !== "lobby") return;
      if (s.players.length < 2) fail("Precisa de pelo menos 2 jogadores.");
      if (pIdx(s, pid) < 0) fail("Entre na mesa antes de começar.");
      s.dealer = rnd(s.players.length); deal(s); break;
    case "next":
      if (s.status !== "roundEnd") return;
      s.dealer = (s.dealer + 1) % s.players.length; deal(s); break;
    case "lobby":
      if (pIdx(s, pid) < 0) fail("Só quem está na mesa pode encerrar.");
      Object.assign(s, {status:"lobby", hands:null, stock:null, discard:null, result:null, log:null, drawn:null});
      break;
    case "zerar":
      s.wins = {}; s.players.forEach(p => s.wins[p.id] = 0); break;
    case "draw": {
      if (!isTurn(s, pid) || s.phase !== "draw") fail("Não é hora de comprar.");
      let c;
      if (m.from === "lixo") {
        if (!s.discard.length) fail("O lixo está vazio.");
        c = s.discard.pop();
      } else {
        if (!s.stock.length) {
          const top = s.discard.pop();
          s.stock = shuffle(s.discard); s.discard = top ? [top] : [];
          if (!s.stock.length) fail("Acabaram as cartas do monte.");
        }
        c = s.stock.pop();
      }
      s.hands[pid].push(c); s.phase = "discard"; s.drawn = c;
      s.log = nickOf(s, pid) + (m.from === "lixo" ? " pegou " + cardName(c) + " do lixo." : " comprou do monte.");
      break;
    }
    case "discard": {
      if (!isTurn(s, pid) || s.phase !== "discard") fail("Compre uma carta antes de descartar.");
      const h = s.hands[pid], i = h.indexOf(m.card);
      if (i < 0) fail("Essa carta não está na sua mão.");
      h.splice(i,1); s.discard.push(m.card);
      s.turn = (s.turn + 1) % s.players.length; s.phase = "draw"; s.drawn = null;
      s.log = nickOf(s, pid) + " descartou " + cardName(m.card) + ".";
      break;
    }
    case "bater": {
      if (!isTurn(s, pid) || s.phase !== "discard") fail("Você só bate logo depois de comprar.");
      const melds = findBatida(s.hands[pid], s.cor);
      if (!melds) fail("Essas 10 cartas ainda não formam 3 + 3 + 4.");
      const limpa = !s.hands[pid].some(c => rk(c) === s.cor);
      s.wins[pid] = (s.wins[pid] || 0) + 1;
      s.status = "roundEnd"; s.result = {winner: pid, melds, limpa};
      s.log = nickOf(s, pid) + " bateu!";
      break;
    }
    default: return;
  }
  saveHost(); broadcast();
}
function hostHandle(pid, m){
  try { apply(pid, m); }
  catch (e) { sendErr(pid, e.message || "Não deu certo."); if (pid !== PID) broadcast(); }
}
function sendErr(pid, msg){
  if (pid === PID) { toast(msg); return; }
  const c = conns.get(pid); if (c && c.open) c.send({t:"err", msg});
}
function viewFor(pid){
  const s = S;
  const mine = s.hands && s.hands[pid] ? s.hands[pid] : null;
  return {
    status: s.status, code: CODE, me: pid, host: PID, round: s.round || 0,
    dealer: s.dealer, turn: s.turn, phase: s.phase, log: s.log || "",
    players: s.players.map(p => ({id:p.id, nick:p.nick, wins:s.wins[p.id]||0,
      count: s.hands && s.hands[p.id] ? s.hands[p.id].length : 0,
      online: p.id === PID || !!(conns.get(p.id) && conns.get(p.id).open)})),
    hand: mine ? mine.slice() : null,
    top: s.discard && s.discard.length ? s.discard[s.discard.length-1] : null,
    stock: s.stock ? s.stock.length : 0,
    vira: s.vira || null, cor: s.cor || null,
    drawn: isTurn(s, pid) ? s.drawn : null,
    result: s.status === "roundEnd" ? s.result : null,
  };
}
function broadcast(){
  for (const [pid, c] of conns) if (c.open) { try { c.send({t:"view", v: viewFor(pid)}); } catch(e){} }
  V = viewFor(PID); render();
}
function saveHost(){ lsSet("cacheta-host", JSON.stringify({code: CODE, pid: PID, s: S})); }

/* =================== anfitrião: rede =================== */
let hostTries = 0;
function startHost(code, state){
  mode = "host"; CODE = code; S = state; V = viewFor(PID);
  history.replaceState(null, "", location.pathname + "?mesa=" + CODE);
  saveHost(); net = "Abrindo a mesa…"; render(); wakeLock();
  if (typeof Peer === "undefined") { net = "Sem internet: não consegui carregar a conexão."; render(); return; }
  peer = new Peer(peerIdFor(CODE), PEER_OPTS);
  peer.on("open", () => { hostTries = 0; net = ""; render(); });
  peer.on("connection", c => {
    c.on("data", d => {
      if (!d || typeof d !== "object") return;
      if (d.t === "hello") {
        const pid = String(d.pid || "").slice(0,24);
        if (!pid || pid === PID) { c.send({t:"err", msg:"Este aparelho já é o anfitrião."}); return; }
        const old = conns.get(pid); if (old && old !== c) { try { old.close(); } catch(e){} }
        c.pid = pid; conns.set(pid, c);
        hostHandle(pid, {a:"hello", nick:d.nick});
        broadcast();
      } else if (d.t === "act" && c.pid && conns.get(c.pid) === c) {
        hostHandle(c.pid, d);
      }
    });
    c.on("close", () => { if (c.pid && conns.get(c.pid) === c) { conns.delete(c.pid); broadcast(); } });
    c.on("error", () => {});
  });
  peer.on("disconnected", () => { net = "Reconectando ao servidor…"; render(); setTimeout(() => { try { peer.reconnect(); } catch(e){} }, 1500); });
  peer.on("error", e => {
    if (e.type === "unavailable-id") {
      // depois de recarregar, o código antigo pode levar alguns segundos para liberar
      hostTries++;

      try { peer.destroy(); } catch(_){}
      if (hostTries < 12) setTimeout(() => startHost(CODE, S), 3000);
      else { net = "Não consegui reabrir a mesa. Crie uma nova."; render(); }
    } else if (["network","server-error","socket-error","socket-closed"].includes(e.type)) {
      net = "Sem conexão. Tentando de novo…"; render();
    }
  });
}

/* =================== convidado: rede =================== */
function startClient(code){
  mode = "client"; CODE = code; V = null; net = "Procurando a mesa " + CODE + "…";
  history.replaceState(null, "", location.pathname + "?mesa=" + CODE);
  lsSet("cacheta-guest", CODE);
  render(); wakeLock();
  if (typeof Peer === "undefined") { net = "Sem internet: não consegui carregar a conexão."; render(); return; }
  peer = new Peer(PEER_OPTS);
  peer.on("open", () => connectClient());
  peer.on("disconnected", () => { setTimeout(() => { try { peer.reconnect(); } catch(e){} }, 1500); });
  peer.on("error", e => {
    if (e.type === "peer-unavailable") { net = V ? "O anfitrião saiu. Esperando ele voltar…" : "Mesa " + CODE + " não encontrada. Confira o código; tentando de novo…"; render(); scheduleRetry(); }
    else if (["network","server-error","socket-error","socket-closed"].includes(e.type)) { net = "Sem conexão. Tentando de novo…"; render(); scheduleRetry(); }
  });
}
function scheduleRetry(){
  if (retryT || mode !== "client") return;
  retryT = setTimeout(() => { retryT = null; connectClient(); }, 3000);
}
function connectClient(){
  if (mode !== "client" || !peer || peer.destroyed) return;
  if (peer.disconnected) { try { peer.reconnect(); } catch(e){} scheduleRetry(); return; }
  if (conn && conn.open) return;
  const c = peer.connect(peerIdFor(CODE), {reliable:true, serialization:"json"});
  let opened = false;
  c.on("open", () => {
    opened = true; conn = c; lastMsg = Date.now();
    c.send({t:"hello", pid:PID, nick:NICK});
    net = ""; render();
  });
  c.on("data", d => {
    lastMsg = Date.now();
    if (!d || typeof d !== "object") return;
    if (d.t === "view") { V = d.v; render(); }
    else if (d.t === "err") toast(d.msg);
  });
  c.on("close", () => { if (conn === c) { conn = null; net = "Conexão caiu. Reconectando…"; render(); scheduleRetry(); } });
  c.on("error", () => {});
  setTimeout(() => { if (!opened) { try { c.close(); } catch(e){} scheduleRetry(); } }, 9000);
}
setInterval(() => {
  if (mode === "client" && conn && Date.now() - lastMsg > 16000) {
    const c = conn; conn = null; try { c.close(); } catch(e){}
    net = "Conexão caiu. Reconectando…"; render(); scheduleRetry();
  }
}, 4000);

function act(a, extra){
  const m = Object.assign({a}, extra || {});

  else toast("Sem conexão com a mesa no momento.");
}
function leave(){
  if (mode === "host") lsDel("cacheta-host"); else lsDel("cacheta-guest");
  try { peer && peer.destroy(); } catch(e){}
  peer = null; conn = null; conns.clear(); S = null; V = null; mode = "start"; CODE = null; net = "";

}

  let saved = null; try { saved = JSON.parse(lsGet("cacheta-host") || "null"); } catch(e){}
  if (urlCode && saved && saved.code === urlCode && saved.pid === PID) { startHost(urlCode, saved.s); return; }
  if (urlCode && NICK && lsGet("cacheta-guest") === urlCode) { startClient(urlCode); return; }
  render();
})();
})();
