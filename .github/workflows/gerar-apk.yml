name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Embutir a biblioteca de conexão no app
        run: cp node_modules/peerjs/dist/peerjs.min.js www/

      - name: Criar projeto Android
        run: npx cap add android

      - name: Manter a tela ligada durante o jogo
        run: cp android-extra/MainActivity.java android/app/src/main/java/br/amigos/cacheta/MainActivity.java

      - name: Gerar ícones
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#123629' --iconBackgroundColorDark '#123629'

      - name: Numerar a versão
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Assinar o APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign \
            --ks keystore/cacheta.p12 --ks-type PKCS12 \
            --ks-pass pass:cacheta-amigos --key-pass pass:cacheta-amigos \
            --ks-key-alias cacheta \
            --out Cacheta.apk alinhado.apk
          "$BT/apksigner" verify Cacheta.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cacheta 1.${{ github.run_number }}
          files: Cacheta.apk
          make_latest: true
