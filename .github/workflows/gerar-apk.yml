name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar o app
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ci/build.sh 2>&1 | tee build.log

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cacheta 1.${{ github.run_number }}
          files: Cacheta.apk
          make_latest: true

      - name: Registrar o erro num issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Falha na execução #${{ github.run_number }} (commit ${{ github.sha }})."
            echo
            echo '```'
            if [ -f build.log ]; then tail -c 60000 build.log; else echo "A falha aconteceu antes da compilação (preparação do ambiente)."; fi
            echo '```'
          } > erro.md
          gh issue create --repo "${{ github.repository }}" --title "Erro na compilação #${{ github.run_number }}" --body-file erro.md
